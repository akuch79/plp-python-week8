<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .title { fill: #f0f6fc; font: 700 28px 'Consolas', 'Monaco', monospace; }
      .text { fill: #c9d1d9; font: 20px 'Consolas', 'Monaco', monospace; }
      .input { fill: #7ee787; font: 20px 'Consolas', 'Monaco', monospace; }
      .result { fill: #a5d6ff; font: 20px 'Consolas', 'Monaco', monospace; }
      .muted { fill: #8b949e; font: 18px 'Consolas', 'Monaco', monospace; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <rect class="panel" x="60" y="40" width="1080" height="620" rx="12"/>
  <text x="90" y="100" class="title">--- SIMPLE CALCULATOR ---</text>
  <text x="90" y="160" class="text">Enter the first number: 10</text>
  <text x="90" y="200" class="text">Enter the second number: 5</text>
  <text x="90" y="255" class="text">Choose an operation:</text>
  <text x="90" y="295" class="text">1. Addition (+)
2. Subtraction (-)
3. Multiplication (*)
4. Division (/)</text>
  <text x="90" y="390" class="input">Enter your choice (1-4): 3</text>
  <text x="90" y="440" class="result">Result: 10.0 * 5.0 = 50.0</text>
  <text x="90" y="620" class="muted">Screenshot: calculator tool</text>
</svg>
